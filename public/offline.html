<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · Pulse Attendance</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
        background: #07080c; color: #f3f5fa;
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif; text-align: center;
      }
      .card { max-width: 380px; border: 1px solid rgba(255,255,255,.08); border-radius: 18px; padding: 32px 24px; background: #0f1117; }
      h1 { font-size: 20px; margin: 18px 0 8px; }
      p { color: #b4bacb; font-size: 14px; line-height: 1.7; margin: 0 0 20px; }
      button {
        border: 0; border-radius: 12px; padding: 12px 22px; font: inherit; font-weight: 600; color: #fff;
        background: linear-gradient(135deg, #7c7cff, #22d3ee);
      }
      svg { width: 46px; height: 46px; }
    </style>
  </head>
  <body>
    <div class="card">
      <svg viewBox="0 0 24 24" fill="none" stroke="#7c7cff" stroke-width="2" stroke-linecap="round">
        <path d="M3 12h4l2.5-6 5 12L17 12h4" />
      </svg>
      <h1>No internet connection</h1>
      <p>
        Your attendance is safe. Connect to the internet and open the app again — check-ins are only
        recorded once they reach the server.
      </p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
